{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>{{ entry.title }}</h2>
    <p>{{ entry.date }}</p>
    <p>{{ entry.content|replace('\n', '<br>')|safe }}</p>
    <a href="{{ url_for('edit', entry_id=entry_id) }}">Редактировать</a>
    <a href="{{ url_for('index') }}">На главную</a>
</div>
{% endblock %}
